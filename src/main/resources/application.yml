server:
  port: 8080 #

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ${DB_PASSWORD:default_password}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true

jwt:
  secret: ${JWT_SECRET_KEY:default_secret_key_very_long_string_123456}
  expiration: 3600000

