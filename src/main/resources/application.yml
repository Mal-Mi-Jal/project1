server:
  port: 8080 #

spring:
  datasource:
    url: ${DATABASE_URL}          # Render 환경변수에서 읽어옴
    driver-class-name: org.postgresql.Driver
    username: sa
    password: ${DB_PASSWORD:default_password}

  jpa:
    hibernate:
      ddl-auto: update
#    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

#  h2:
#    console:
#      enabled: true

jwt:
  secret: ${JWT_SECRET_KEY:default_secret_key_very_long_string_123456}
  expiration: 3600000

